name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37.2
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - name: Pull prebuilt engine + native libs from the official release
        run: |
          set -e
          curl -fL -o /tmp/official.apk "https://github.com/jackwener/DSH-Android/releases/download/v0.3.11/DSH-Android-v0.3.11-arm64.apk"
          mkdir -p toolchains/out/engine toolchains/out/jniLibs/arm64-v8a
          unzip -o -j /tmp/official.apk "assets/engine.zip" "assets/engine.sha256" "assets/engine-version.txt" -d toolchains/out/engine
          for l in libnode libdshengine libdshnode libc++_shared libdsh_pty libdsh_flock librg; do
            unzip -o -j /tmp/official.apk "lib/arm64-v8a/$l.so" -d toolchains/out/jniLibs/arm64-v8a
          done
          ls -la toolchains/out/engine toolchains/out/jniLibs/arm64-v8a

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -Pdsh.engineOut="$PWD/toolchains/out/engine" \
            -Pdsh.nativeOut="$PWD/toolchains/out/jniLibs"

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \; || true
          ls -la out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-debug-apk
          path: out/*.apk
          if-no-files-found: warn
