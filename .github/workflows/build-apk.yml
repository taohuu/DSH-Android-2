name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [voice]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reuse one debug keystore across runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dsh-debug-keystore-v1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37.2
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - name: Base source (v0.3.11) + our patch overlay
        run: |
          set -e
          curl -fL -o base.tgz "https://github.com/jackwener/DSH-Android/archive/refs/tags/v0.3.11.tar.gz"
          mkdir -p src
          tar xzf base.tgz -C src --strip-components=1
          cp -a voice-patch/. src/

      - name: Retarget for a side-by-side install
        run: |
          set -e
          sed -i 's/applicationId = "io.github.jackwener.dsh"/applicationId = "io.github.jackwener.dsh.voice"/' src/app/build.gradle.kts
          sed -i 's#<string name="app_name">DSH</string>#<string name="app_name">DSH语音</string>#' src/app/src/main/res/values/strings.xml
          grep -n 'applicationId' src/app/build.gradle.kts
          grep -n 'name="app_name"' src/app/src/main/res/values/strings.xml

      - name: Prebuilt engine + native libs from the matching release
        run: |
          set -e
          curl -fL -o /tmp/official.apk "https://github.com/jackwener/DSH-Android/releases/download/v0.3.11/DSH-Android-v0.3.11-arm64.apk"
          mkdir -p src/toolchains/out/engine src/toolchains/out/jniLibs/arm64-v8a
          unzip -o -j /tmp/official.apk "assets/engine.zip" "assets/engine.sha256" "assets/engine-version.txt" -d src/toolchains/out/engine
          for l in libnode libdshengine libdshnode libc++_shared libdsh_pty libdsh_flock librg; do
            unzip -o -j /tmp/official.apk "lib/arm64-v8a/$l.so" -d src/toolchains/out/jniLibs/arm64-v8a
          done
          ls -la src/toolchains/out/engine src/toolchains/out/jniLibs/arm64-v8a

      - name: Unit tests
        run: cd src && ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --tests "io.github.jackwener.dsh.feature.voice.SpokenTextTest" --tests "io.github.jackwener.dsh.feature.voice.WakeWordTest"

      - name: Build debug APK
        run: |
          cd src
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -Pdsh.engineOut="$PWD/toolchains/out/engine" \
            -Pdsh.nativeOut="$PWD/toolchains/out/jniLibs"

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          find src/app/build/outputs -name "*.apk" -exec cp {} out/ \; || true
          ls -la out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-debug-apk
          path: out/*.apk
          if-no-files-found: warn
