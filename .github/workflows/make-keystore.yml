name: make-keystore
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/make-keystore.yml
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate a fixed debug keystore
        run: |
          keytool -genkeypair -keystore dsh-debug.keystore -storetype PKCS12 \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -la dsh-debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-debug-keystore
          path: dsh-debug.keystore
